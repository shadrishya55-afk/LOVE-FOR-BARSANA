<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="chonkFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB74D"/>
    </linearGradient>
  </defs>
  <!-- Big Chonky Round Body -->
  <ellipse cx="100" cy="115" rx="72" ry="60" fill="url(#chonkFur)" stroke="#FFA726" stroke-width="2"/>
  <!-- Ears -->
  <polygon points="50,75 35,35 75,60" fill="#FFB74D"/>
  <polygon points="52,70 42,45 70,60" fill="#FF80AB"/>
  <polygon points="150,75 165,35 125,60" fill="#FFB74D"/>
  <polygon points="148,70 158,45 130,60" fill="#FF80AB"/>
  <!-- Tiger stripes on head -->
  <path d="M100 65 L96 80 L104 80 Z" fill="#E65100" opacity="0.6"/>
  <path d="M85 68 L82 80 L90 80 Z" fill="#E65100" opacity="0.6"/>
  <path d="M115 68 L110 80 L118 80 Z" fill="#E65100" opacity="0.6"/>
  <!-- Contented smiling eyes ( ◡ ω ◡ ) -->
  <path d="M65 95 Q75 105 85 95" stroke="#212121" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M115 95 Q125 105 135 95" stroke="#212121" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Chubby cheeks and mouth -->
  <polygon points="100,105 96,100 104,100" fill="#FF4081"/>
  <path d="M92 110 Q100 120 100 110 Q100 120 108 110" stroke="#212121" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Big Rosy Blush -->
  <circle cx="55" cy="108" r="12" fill="#FF4081" opacity="0.6"/>
  <circle cx="145" cy="108" r="12" fill="#FF4081" opacity="0.6"/>
  <!-- Tiny paws resting on belly -->
  <circle cx="75" cy="150" r="12" fill="#FFE082" stroke="#FFA726" stroke-width="1.5"/>
  <circle cx="125" cy="150" r="12" fill="#FFE082" stroke="#FFA726" stroke-width="1.5"/>
  <!-- Floating Heart -->
  <path d="M100 25 Q100 15 90 15 Q80 15 80 25 Q80 37 100 50 Q120 37 120 25 Q120 15 110 15 Q100 15 100 25" fill="#FF69B4"/>
</svg>
